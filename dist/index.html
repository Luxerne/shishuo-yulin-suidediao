    <section class="hero" aria-labelledby="title">
      <div><div class="eyebrow">A story carved in stone</div><h1 id="title">石说榆林<span>绥德石雕的岁月新刻</span></h1><p class="lead">老錾子传了两千多年，这一回，它遇上了一台新机器。<span class="story-line">一个年轻人回望石雕、机器，和匠人的手，在石头的纹理里重新寻找传承的答案。</span></p></div>
    </section>

        <button id="play-film" type="button">播放视频</button>
      </div>

      <div class="tv-knob volume" role="slider" tabindex="0" aria-label="电视音量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" aria-valuetext="音量 100%" title="上下拖动调节音量"></div>
    </section>
    <section class="section" aria-labelledby="search-title">

      <div id="result" class="result" role="status" aria-live="polite"></div>
      <article id="transcript" class="transcript" aria-label="影片旁白全文"></article>
    </section>
    <section class="section" aria-labelledby="themes-title">
      <div class="section-head"><h2 id="themes-title">石头记得的事</h2></div>
      <div class="themes">
        <div class="theme"><b>一凿一錾</b><p>绥德石雕的手上功夫，在时间里磨出纹样，也留下人的经验。</p></div>
        <div class="theme"><b>机器入场</b><p>程序带来精确与效率，也提出新的问题：形之外，神韵如何抵达？</p></div>
        <div class="theme"><b>回望匠人</b><p>年轻人重新看见石头、父辈与日常劳动之间的联系。</p></div>
        <div class="theme"><b>让传统向前</b><p>当石雕走进新的空间，传统技艺也在寻找继续生长的方式。</p></div>
      </div>
    </section>

  <script id="transcript-data" type="application/json">"第一场｜石头遇见机器\n说书先生旁白\n今儿不说那王侯将相，单说绥德这一块石头。老錾子传了两千多年，这一回，它遇上了一台新机器。\n第二场｜我以为，精确就是答案\n我打小就在这叮叮当当里长大。这声能从清早响到天擦黑。\n那会儿我还真以为，\n石雕就是这样的。\n一锤一錾，切磋琢磨\n石头就慢慢变成了狮子的模样。\n可是后来，机器进了工坊。\n落刀的角度能被计算纹样能被复刻，连下一刀的深度与力度，\n都能提前写进程序。我甚至相信——只要数据足够准确，机器不仅能够雕出石狮的形，也能把它的神，一并给雕出来。\n第三场｜一百尊石狮，一个模样\n过去几天才能完成的工作，现在只需更短的时间。\n快了，准了，也齐整了。\n那会儿我觉着，\n这就是石雕的新路子嘛。\n可真等我站到那一排石狮跟前，\n心里反倒有点不是滋味。\n一百尊，分毫不差，\n我看来看去，\n总觉得少了些什么。少了些什么呢？\n我想去寻找这个答案。\n第四场｜下刀之前，先看石头\n阿川旁白\n爷爷跟石头打了几十年交道。\n他啥也没说，\n只挑了块石头，搬到亮处。先看看它长成啥样，\n再顺着纹路又摸一遍；\n敲两下，听听声儿，\n心里才晓得，这一刀该往哪儿落。那是我从小见过无数次，却从未真正看懂的工序——相石。\n数据知道石头有多高、多宽、多硬，却不知道它经历过怎样的挤压，也不知道哪一道纹理下面，藏着它最容易碎裂的地方。\n原来我从来没有真正读懂石头。而匠人们，\n就是让每一块石头\n找到自己的模样。\n那天，我对着那块石头看了很久。\n它是一个个鲜活的生命。\n它是花鸟，是鱼虫，是万物\n它的魂，需要匠人的手，亲自点亮。\n第五场｜重新写一条刀路\n我把原来的刀路全翻出来，重新改。\n一个模子套不住所有的石头。\n石头的纹往哪儿走，构图就顺着往哪儿长。\n机器先把形塑出来，\n眉眼的轻重、鬃毛的转折、嘴角那点神气，\n还得留给人的手。\n第六场｜石头走出了工坊\n从此以后，石雕有了更多新可能。\n一尊尊新的石狮摆上展台，\n它们还留着阔嘴、宽鼻、卷鬃，\n但是，它们有了各自不同的神态。\n有人把它带回家，\n有人把它摆上书桌。\n石桌凳、石栏、石亭，\n它们从工坊出发，走向越来越远的地方。\n石雕不再只是一个人的手艺。\n从构图、生产，\n到安装、销售，\n一块石头背后，\n开始站着越来越多的人。\n工坊里，也添了越来越多年轻的面孔。\n他们第一次摸到石头，\n第一次握住锤錾，\n也第一次听见——\n一门老手艺，在今天继续发出的声音。\n第七场｜让石魂走进新的时代\n阿川旁白\n从汉画像石里的生活，\n到炕头石狮里祈愿，\n从门楼、桥梁和牌坊上的文化记忆\n到今天机器与手工共同雕出的新模样\n绥德石雕在每个时代\n焕发新生\n第八场｜新刻未完\n阿川旁白\n真正的传承，\n像黄河——\n带着自己的源头，\n穿过一次次转折，\n始终向前。\n石魂也是这样。\n从一双手，\n到另一双手；\n从一个时代，\n走向下一个时代。\n生生不息。\n说书先生旁白\n机器塑形，手工赋神。石头还是咱绥德的石头。\n绥德又刻下了一段新书。"</script>
  <script>
    const box=document.querySelector('#transcript'),input=document.querySelector('#query'),status=document.querySelector('#result'),full=JSON.parse(document.querySelector('#transcript-data').textContent);box.textContent=full;
    function search(){const q=input.value.trim();if(!q){box.textContent=full;status.textContent=`显示旁白全文 · ${full.trim().length.toLocaleString()} 字`;return}if(!full){status.textContent='旁白仍在载入，请稍候。';return}const chunks=full.split(/(?=第[一二三四五六七八九十]+场)/);const matches=chunks.filter(s=>s.toLowerCase().includes(q.toLowerCase()));box.replaceChildren();for(const part of matches){const p=document.createElement('p');p.textContent=part.trim();const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');p.innerHTML=p.textContent.replace(re,m=>`<mark>${m}</mark>`);box.append(p)}status.textContent=matches.length?`找到 ${matches.length} 段相关旁白`:`没有找到“${q}”，试试“石狮”或“匠人”`}
    document.querySelector('#search').addEventListener('click',search);input.addEventListener('keydown',e=>{if(e.key==='Enter')search()});input.addEventListener('search',()=>{if(!input.value)search()});
    const galleryLinks=[...document.querySelectorAll('.storyboard-item')],viewer=document.querySelector('#storyboard-viewer'),viewerImage=document.querySelector('#storyboard-view-image');let storyboardIndex=0;
    function showStoryboard(index){storyboardIndex=(index+galleryLinks.length)%galleryLinks.length;const link=galleryLinks[storyboardIndex];viewerImage.src=link.href;viewerImage.alt=link.querySelector('img').alt;if(!viewer.open)viewer.showModal()}
    galleryLinks.forEach((link,index)=>link.addEventListener('click',event=>{event.preventDefault();showStoryboard(index)}));
    document.querySelector('.viewer-back').addEventListener('click',()=>viewer.close());document.querySelector('.viewer-prev').addEventListener('click',()=>showStoryboard(storyboardIndex-1));document.querySelector('.viewer-next').addEventListener('click',()=>showStoryboard(storyboardIndex+1));
    viewer.addEventListener('click',event=>{if(event.target===viewer)viewer.close()});document.addEventListener('keydown',event=>{if(!viewer.open)return;if(event.key==='ArrowLeft')showStoryboard(storyboardIndex-1);if(event.key==='ArrowRight')showStoryboard(storyboardIndex+1)});
    const video=document.querySelector('#film'),playButton=document.querySelector('#play-film');let brightness=1,volume=1;
    function applyControls(){video.style.filter=`brightness(${brightness})`;video.volume=volume;document.querySelector('.tv-knob.brightness').setAttribute('aria-valuenow',Math.round(brightness*100));document.querySelector('.tv-knob.brightness').setAttribute('aria-valuetext',`亮度 ${Math.round(brightness*100)}%`);document.querySelector('.tv-knob.volume').setAttribute('aria-valuenow',Math.round(volume*100));document.querySelector('.tv-knob.volume').setAttribute('aria-valuetext',`音量 ${Math.round(volume*100)}%`)}
    function setKnob(knob,value){if(knob.classList.contains('brightness'))brightness=Math.max(.5,Math.min(1.5,value));else volume=Math.max(0,Math.min(1,value));applyControls()}
    document.querySelectorAll('.tv-knob').forEach(knob=>{let startY=0,startValue=0;knob.addEventListener('pointerdown',e=>{startY=e.clientY;startValue=knob.classList.contains('brightness')?brightness:volume;knob.setPointerCapture(e.pointerId);e.preventDefault()});knob.addEventListener('pointermove',e=>{if(!knob.hasPointerCapture(e.pointerId))return;const delta=(startY-e.clientY)/180;setKnob(knob,startValue+delta*(knob.classList.contains('brightness')?1:.8))});knob.addEventListener('keydown',e=>{if(!['ArrowUp','ArrowDown','Home','End'].includes(e.key))return;e.preventDefault();const step=knob.classList.contains('brightness')?.05:.05,current=knob.classList.contains('brightness')?brightness:volume;setKnob(knob,e.key==='Home'?(knob.classList.contains('brightness')?.5:0):e.key==='End'?(knob.classList.contains('brightness')?1.5:1):current+(e.key==='ArrowUp'?step:-step))})});applyControls();
    playButton.addEventListener('click',async()=>{playButton.disabled=true;playButton.textContent='正在加载…';try{const manifest=await fetch('media/manifest.json').then(r=>{if(!r.ok)throw Error('无法读取视频清单');return r.json()}),parts=[];for(let i=0;i<manifest.chunks.length;i++){const response=await fetch(manifest.chunks[i]);if(!response.ok)throw Error('视频文件加载失败');parts.push(await response.arrayBuffer());playButton.textContent=`加载 ${Math.round((i+1)/manifest.chunks.length*100)}%`}const url=URL.createObjectURL(new Blob(parts,{type:'video/mp4'}));video.src=url;video.hidden=false;applyControls();document.querySelector('#film-prompt').hidden=true;await video.play()}catch(error){playButton.textContent='播放视频';playButton.disabled=false;playButton.title=`视频加载失败：${error.message}，请刷新页面后重试。`}});
  </script>
